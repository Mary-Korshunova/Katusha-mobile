<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Прототип</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; --bg:#f4f5f7; --card:#fff; --text:#16181d; --muted:#6b7280; --line:#d6d9df; --accent:#2f5bea; --err:#d93025; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1b1e24; --text:#eef0f3; --muted:#9aa1ad; --line:#353a44; --accent:#6d8dff; --err:#ff6b5e; } }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
  form { width:100%; max-width:340px; background:var(--card); border-radius:16px; padding:28px 24px;
    box-shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); }
  h1 { font-size:20px; margin:0 0 6px; font-weight:600; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input[type=password] { width:100%; font:inherit; font-size:17px; padding:12px 14px; border:1px solid var(--line);
    border-radius:10px; background:transparent; color:inherit; outline:none; }
  input[type=password]:focus { border-color:var(--accent); }
  label { display:flex; gap:8px; align-items:center; margin:14px 0 18px; font-size:14px; color:var(--muted); cursor:pointer; }
  button { width:100%; font:inherit; font-weight:600; padding:12px; border:0; border-radius:10px;
    background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #msg { min-height:20px; margin-top:12px; max-width:340px; font-size:14px; color:var(--muted); text-align:center; }
  #msg.err { color:var(--err); }
</style>
</head>
<body>
<form id="f" autocomplete="off" hidden>
  <h1>Прототип защищён</h1>
  <p>Введите пароль, чтобы открыть.</p>
  <input id="pw" type="password" placeholder="Пароль" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <label><input id="rem" type="checkbox" checked> Запомнить на этом устройстве</label>
  <button id="go" type="submit">Открыть</button>
</form>
<div id="msg" aria-live="polite"></div>
<script>
(function () {
  var SALT = "pvn8HyVajRtxBxlOQy2TzA==", ITER = 600000, PAGE = "index.html", STORE = "proto-key:" + SALT;
  var f = document.getElementById("f"), pw = document.getElementById("pw"), rem = document.getElementById("rem"),
      go = document.getElementById("go"), msg = document.getElementById("msg");
  var subtle = window.crypto && window.crypto.subtle;
  var base = location.pathname.replace(/[^\/]*$/, "");

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function say(t, err) { msg.textContent = t; msg.className = err ? "err" : ""; }
  function store(op, v) { try { if (op === "get") return localStorage.getItem(STORE); if (op === "set") localStorage.setItem(STORE, v); else localStorage.removeItem(STORE); } catch (e) {} return null; }

  function fetchBin(id) {
    return fetch(base + "d/" + id + ".bin", { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status); return r.arrayBuffer();
    });
  }
  function dec(key, buf) {
    return subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(buf, 0, 12) }, key, new Uint8Array(buf, 12));
  }
  function deriveKey(pass) {
    return subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]).then(function (k) {
      return subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, k,
        { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }

  function open(key, remember) {
    var manifest;
    return fetchBin("m").then(function (buf) {
      return dec(key, buf).catch(function () { var e = new Error("bad"); e.bad = true; throw e; });
    }).then(function (plain) {
      manifest = JSON.parse(new TextDecoder().decode(plain));
      if (remember) subtle.exportKey("raw", key).then(function (raw) {
        var s = "", u = new Uint8Array(raw); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); store("set", btoa(s));
      });
      var paths = Object.keys(manifest.assets), urls = {}, done = 0, idx = 0;
      say("Загрузка… 0%");
      function worker() {
        if (idx >= paths.length) return Promise.resolve();
        var p = paths[idx++], a = manifest.assets[p];
        return fetchBin(a[0]).then(function (b) { return dec(key, b); }).then(function (plain) {
          urls[p] = URL.createObjectURL(new Blob([plain], { type: a[1] }));
          done++; say("Загрузка… " + Math.round(done * 100 / paths.length) + "%");
        }).then(worker);
      }
      var pool = []; for (var k = 0; k < 6; k++) pool.push(worker());
      return Promise.all(pool).then(function () { return fetchBin(manifest.pages[PAGE]); })
        .then(function (b) { return dec(key, b); })
        .then(function (plain) {
          var map = {};
          Object.keys(urls).forEach(function (p) { if (p.indexOf("assets/") === 0) map[p.slice(7)] = urls[p]; });
          var html = new TextDecoder().decode(plain)
            .replace("__ASSETS_MAP__", JSON.stringify(map))
            .replace(/__A\[([^\]]+)\]__/g, function (m, p) { return urls[p] || p; });
          document.open(); document.write(html); document.close();
        });
    });
  }

  function fail(e) {
    go.disabled = false; pw.disabled = false; f.hidden = false;
    if (e && e.bad) { say("Неверный пароль", true); pw.select(); }
    else say("Не удалось загрузить. Проверьте интернет и обновите страницу.", true);
  }

  if (!subtle) { f.hidden = false; say("Браузер не поддерживает расшифровку. Откройте ссылку в Chrome, Safari, Edge или Firefox.", true); go.disabled = true; return; }

  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    go.disabled = true; pw.disabled = true; say("Проверяю пароль…");
    deriveKey(pw.value).then(function (key) { return open(key, rem.checked); }).catch(fail);
  });

  var saved = store("get");
  if (saved) {
    say("Открываю…");
    subtle.importKey("raw", b64(saved), { name: "AES-GCM" }, true, ["decrypt"])
      .then(function (key) { return open(key, false); })
      .catch(function (e) { if (e && e.bad) { store("del"); say(""); } else fail(e); f.hidden = false; pw.focus(); });
  } else { f.hidden = false; pw.focus(); }
})();
</script>
</body>
</html>
